<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Traveloop - My Trips</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <span class="logo">✈️ Traveloop</span>
  <div class="nav-links">
    <a href="dashboard.html">Home</a>
    <a href="my-trips.html" class="active">My Trips</a>
    <a href="community.html">Community</a>
    <a href="profile.html">Profile</a>
    <a href="admin.html" style="color:#dc2626;font-weight:700;">Admin</a>
  </div>
</nav>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search trips..." oninput="renderTrips()">
  <select id="groupBy" onchange="renderTrips()">
    <option value="">Group by</option>
    <option value="status">Status</option>
    <option value="place">Destination</option>
  </select>
  <select id="filterBy" onchange="renderTrips()">
    <option value="">Filter</option>
    <option value="ongoing">Ongoing</option>
    <option value="upcoming">Upcoming</option>
    <option value="completed">Completed</option>
  </select>
  <select id="sortBy" onchange="renderTrips()">
    <option value="">Sort by</option>
    <option value="date">Date</option>
    <option value="name">Name</option>
  </select>
</div>

<div class="page">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
    <h2 style="color:#1e40af;">My Trips</h2>
    <a href="create-trip.html" class="btn btn-sm">+ Plan a new Trip</a>
  </div>

  <div id="ongoing-section">
    <div class="sec-label" style="margin-top:16px;">Ongoing</div>
    <div id="ongoing-list"></div>
  </div>
  <div id="upcoming-section">
    <div class="sec-label">Up-coming</div>
    <div id="upcoming-list"></div>
  </div>
  <div id="completed-section">
    <div class="sec-label">Completed</div>
    <div id="completed-list"></div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h3>🗑️ Delete Trip</h3>
    <p style="font-size:13px;color:#555;margin-bottom:20px;">Are you sure you want to delete this trip? This cannot be undone.</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn btn-outline btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red btn-sm" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
let deleteId=null;

function renderTrips(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const flt=document.getElementById('filterBy').value;
  const srt=document.getElementById('sortBy').value;
  let trips=JSON.parse(localStorage.getItem('tl_trips')||'[]');
  if(q)trips=trips.filter(t=>(t.name||'').toLowerCase().includes(q)||(t.place||'').toLowerCase().includes(q));
  if(flt)trips=trips.filter(t=>t.status===flt);
  if(srt==='date')trips.sort((a,b)=>a.startDate>b.startDate?1:-1);
  if(srt==='name')trips.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  renderList('ongoing-list',trips.filter(t=>t.status==='ongoing'));
  renderList('upcoming-list',trips.filter(t=>t.status==='upcoming'));
  renderList('completed-list',trips.filter(t=>t.status==='completed'));
}

function renderList(id,trips){
  const el=document.getElementById(id);
  if(!trips.length){el.innerHTML='<p style="color:#bbb;font-size:13px;padding:10px 0;">No trips here.</p>';return;}
  el.innerHTML=trips.map(t=>`
    <div class="card" style="display:flex;gap:16px;align-items:flex-start;padding:14px;">
      <div style="width:100px;height:75px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#f0f2f5;">
        <img src="${t.img||'https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=200&h=100&fit=crop'}" alt="${t.place}" style="width:100%;height:100%;object-fit:cover;">
      </div>
      <div style="flex:1;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div style="font-weight:700;font-size:15px;color:#1e40af;">${t.name||t.place}</div>
            <div style="font-size:12px;color:#888;margin-top:3px;">📍 ${t.place} &nbsp;|&nbsp; 📅 ${t.startDate} → ${t.endDate}${t.budget?' &nbsp;|&nbsp; 💰 $'+t.budget:''}</div>
          </div>
          <span class="badge ${t.status==='ongoing'?'badge-green':t.status==='upcoming'?'badge-blue':'badge-gray'}">${t.status}</span>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
          <a href="itinerary.html?id=${t.id}" class="btn btn-outline btn-sm">📋 Itinerary</a>
          <a href="budget.html?id=${t.id}" class="btn btn-outline btn-sm">🗓️ Day Plan</a>
          <a href="packing.html?id=${t.id}" class="btn btn-outline btn-sm">🎒 Packing</a>
          <a href="notes.html?id=${t.id}" class="btn btn-outline btn-sm">📝 Notes</a>
          <a href="expense.html?id=${t.id}" class="btn btn-outline btn-sm">💳 Expense</a>
          <a href="create-trip.html?edit=${t.id}" class="btn btn-gray btn-sm">✏️ Edit</a>
          <button class="btn btn-red btn-sm" onclick="deleteTrip('${t.id}')">🗑️</button>
        </div>
      </div>
    </div>`).join('');
}

function deleteTrip(id){deleteId=id;document.getElementById('deleteModal').classList.add('open');}
function closeModal(){document.getElementById('deleteModal').classList.remove('open');deleteId=null;}
function confirmDelete(){
  if(!deleteId)return;
  let trips=JSON.parse(localStorage.getItem('tl_trips')||'[]');
  trips=trips.filter(t=>t.id!==deleteId);
  localStorage.setItem('tl_trips',JSON.stringify(trips));
  closeModal();renderTrips();
}

renderTrips();
</script>
</body>
</html>
