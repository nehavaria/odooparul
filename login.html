<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Traveloop - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="photo-circle">
      <img src="https://images.unsplash.com/photo-1488085061387-422e29b40080?w=80&h=80&fit=crop" alt="travel">
    </div>
    <h2>✈️ Traveloop</h2>
    <div id="msg" class="alert"></div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>
    <button class="btn" style="width:100%;margin-top:4px;" onclick="login()">Login</button>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:#888;">
      Don't have an account? <a href="register.html" style="color:#2563eb;font-weight:700;">Register</a>
    </p>
  </div>
</div>
<script>
function login(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value.trim();
  if(!email||!pass){showMsg('Please enter email and password.','error');return;}
  const users=JSON.parse(localStorage.getItem('tl_users')||'[]');
  const user=users.find(u=>u.email===email&&u.password===pass);
  if(!user){showMsg('Invalid email or password.','error');return;}
  localStorage.setItem('tl_user',JSON.stringify(user));
  showMsg('Login successful! Redirecting...','success');
  setTimeout(()=>window.location.href='dashboard.html',1000);
}
function showMsg(t,type){
  const m=document.getElementById('msg');
  m.className='alert alert-'+type;
  m.style.display='block';
  m.textContent=t;
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
