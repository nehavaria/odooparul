<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Traveloop - Packing Checklist</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <span class="logo">✈️ Traveloop</span>
  <div class="nav-links">
    <a href="dashboard.html">Home</a>
    <a href="my-trips.html">My Trips</a>
    <a href="admin.html" style="color:#dc2626;font-weight:700;">Admin</a>
  </div>
</nav>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search items..." oninput="filterItems()">
  <select id="groupBy" onchange="renderChecklist()">
    <option value="">Group by</option>
    <option value="category">Category</option>
  </select>
  <select id="filterBy" onchange="renderChecklist()">
    <option value="">Filter</option>
    <option value="packed">Packed</option>
    <option value="unpacked">Unpacked</option>
  </select>
  <select id="sortBy" onchange="renderChecklist()">
    <option value="">Sort by</option>
    <option value="name">Name</option>
  </select>
</div>

<div class="page">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <div>
      <h2 style="color:#1e40af;" id="tripTitle">🎒 Packing Checklist</h2>
      <p id="tripMeta" style="font-size:13px;color:#888;margin-top:3px;"></p>
    </div>
    <div style="display:flex;gap:8px;">
      <select id="tripSelect" style="padding:7px 12px;border:1px solid #ccc;border-radius:6px;font-size:13px;" onchange="loadTripChecklist()">
        <option value="">Select Trip</option>
      </select>
    </div>
  </div>

  <!-- Progress -->
  <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:5px;">
    <span style="font-weight:600;color:#555;">Progress:</span>
    <span id="prog-label" style="font-weight:700;color:#1e40af;">0 / 0 packed</span>
  </div>
  <div class="prog-wrap" style="height:14px;"><div class="prog-fill" id="prog-fill" style="width:0%;"></div></div>

  <div id="msg" class="alert"></div>
  <div id="checklist-wrap"></div>

  <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
    <button class="btn btn-outline btn-sm" onclick="openAddModal()">+ add item to checklist</button>
    <button class="btn btn-outline btn-sm" onclick="resetAll()">Reset all</button>
    <button class="btn btn-sm" onclick="shareChecklist()">Share Checklist</button>
  </div>
</div>

<!-- Add Item Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <button class="close-btn" onclick="closeAddModal()">✕</button>
    <h3>+ Add Item to Checklist</h3>
    <div class="form-group"><label>Item Name</label><input type="text" id="newItem" placeholder="e.g. Sunscreen"></div>
    <div class="form-group"><label>Category</label>
      <select id="newCat">
        <option value="Documents">Documents</option>
        <option value="Clothing">Clothing</option>
        <option value="Electronics">Electronics</option>
        <option value="Toiletries">Toiletries</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn btn-outline btn-sm" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-sm" onclick="addItem()">Add Item</button>
    </div>
  </div>
</div>

<script>
const params=new URLSearchParams(location.search);
const tripId=params.get('id');
let currentTripId=tripId||null;

const DEFAULT_ITEMS=[
  {name:'Passport',cat:'Documents',packed:true},
  {name:'Flight Tickets (printed)',cat:'Documents',packed:true},
  {name:'Travel Insurance',cat:'Documents',packed:false},
  {name:'Hotel booking confirmation',cat:'Documents',packed:true},
  {name:'Casual Shirts',cat:'Clothing',packed:true},
  {name:'Trousers / jeans',cat:'Clothing',packed:false},
  {name:'Comfortable walking shoes',cat:'Clothing',packed:false},
  {name:'Light jacket / windbreaker',cat:'Clothing',packed:false},
  {name:'Phone charger',cat:'Electronics',packed:true},
  {name:'Universal power adaptor',cat:'Electronics',packed:true},
  {name:'Earphone / headphones',cat:'Electronics',packed:true},
  {name:'Toothbrush & toothpaste',cat:'Toiletries',packed:false},
  {name:'Sunscreen',cat:'Toiletries',packed:false},
];

function getKey(){return 'tl_packing_'+(currentTripId||'default');}
function getItems(){return JSON.parse(localStorage.getItem(getKey())||'null')||DEFAULT_ITEMS.map(i=>({...i}));}
function saveItems(items){localStorage.setItem(getKey(),JSON.stringify(items));}

function loadTrips(){
  const trips=JSON.parse(localStorage.getItem('tl_trips')||'[]');
  const sel=document.getElementById('tripSelect');
  trips.forEach(t=>{
    const opt=document.createElement('option');
    opt.value=t.id;opt.textContent=t.name||t.place;
    if(t.id===currentTripId)opt.selected=true;
    sel.appendChild(opt);
  });
  if(currentTripId){
    const trip=trips.find(t=>t.id===currentTripId);
    if(trip){
      document.getElementById('tripTitle').textContent='🎒 Packing: '+trip.name;
      document.getElementById('tripMeta').textContent='📍 '+trip.place+' | 📅 '+trip.startDate+' → '+trip.endDate;
    }
  }
}

function loadTripChecklist(){
  currentTripId=document.getElementById('tripSelect').value||null;
  renderChecklist();
}

function renderChecklist(){
  const flt=document.getElementById('filterBy').value;
  const srt=document.getElementById('sortBy').value;
  let items=getItems();
  if(flt==='packed')items=items.filter(i=>i.packed);
  if(flt==='unpacked')items=items.filter(i=>!i.packed);
  if(srt==='name')items.sort((a,b)=>a.name.localeCompare(b.name));
  const cats={};
  items.forEach(item=>{
    if(!cats[item.cat])cats[item.cat]=[];
    cats[item.cat].push(item);
  });
  const allItems=getItems();
  const packed=allItems.filter(i=>i.packed).length;
  const pct=allItems.length?Math.round((packed/allItems.length)*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-label').textContent=packed+' / '+allItems.length+' packed';
  document.getElementById('checklist-wrap').innerHTML=Object.entries(cats).map(([cat,citems])=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong style="color:#1e40af;">${cat}</strong>
        <span style="font-size:12px;color:#888;font-weight:600;">${citems.filter(i=>i.packed).length}/${citems.length}</span>
      </div>
      ${citems.map(item=>`
        <div class="chk-item ${item.packed?'done':''}" id="chk_${item.name.replace(/\s/g,'_')}">
          <input type="checkbox" ${item.packed?'checked':''} onchange="toggleItem('${item.name}',this.checked)">
          <label onclick="toggleItem('${item.name}',!document.querySelector('#chk_${item.name.replace(/\s/g,'_')} input').checked)">${item.name}</label>
          <button onclick="removeItem('${item.name}')" style="background:none;border:none;cursor:pointer;color:#ddd;font-size:13px;margin-left:auto;" title="Remove">✕</button>
        </div>`).join('')}
    </div>`).join('');
}

function toggleItem(name,checked){
  const items=getItems();
  const idx=items.findIndex(i=>i.name===name);
  if(idx>-1){items[idx].packed=checked;saveItems(items);renderChecklist();}
}

function removeItem(name){
  const items=getItems().filter(i=>i.name!==name);
  saveItems(items);renderChecklist();
}

function filterItems(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.chk-item').forEach(el=>{
    el.style.display=(!q||el.textContent.toLowerCase().includes(q))?'flex':'none';
  });
}

function resetAll(){
  const items=getItems().map(i=>({...i,packed:false}));
  saveItems(items);renderChecklist();
}

function openAddModal(){document.getElementById('addModal').classList.add('open');}
function closeAddModal(){document.getElementById('addModal').classList.remove('open');}

function addItem(){
  const name=document.getElementById('newItem').value.trim();
  const cat=document.getElementById('newCat').value;
  if(!name){alert('Please enter item name.');return;}
  const items=getItems();
  if(items.find(i=>i.name===name)){alert('Item already exists.');return;}
  items.push({name,cat,packed:false});
  saveItems(items);closeAddModal();
  document.getElementById('newItem').value='';
  renderChecklist();
}

function shareChecklist(){
  const items=getItems();
  const text=items.map(i=>(i.packed?'✅':'⬜')+' '+i.name).join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(text);alert('Checklist copied to clipboard!');}
}

loadTrips();
renderChecklist();
</script>
</body>
</html>
